services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokerman
      POSTGRES_PASSWORD: pokerman
      POSTGRES_DB: pokerman
    ports:
      - "5432:5432"
    volumes:
      - pokerman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokerman"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pokerman:pokerman@db:5432/pokerman
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pokerman_pgdata:
